<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>You’re in — Pickup</title>
  <meta name="description" content="Email confirmed. Open Pickup and call game." />
  <meta name="robots" content="noindex" />

  <meta name="apple-itunes-app" content="app-id=6769906203" />

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/favicon-180.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #070706; --card: #14140f; --line: #23231d;
      --ink: #f0f0eb; --sub: #96a098; --dim: #6e7670;
      --accent: #3dba5e; --on-accent: #062611;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: 'DM Sans', -apple-system, sans-serif;
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      width: 100%; max-width: 420px; background: var(--card);
      border: 1px solid var(--line); border-radius: 24px; padding: 36px 28px;
      text-align: center;
    }
    .mark { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 20px; display: block; }
    .check {
      width: 44px; height: 44px; border-radius: 22px; margin: 0 auto 16px;
      background: rgba(61, 186, 94, 0.14); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700;
    }
    h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 10px; }
    p.sub { color: var(--sub); font-size: 15px; line-height: 1.55; margin-bottom: 28px; }
    a.btn {
      display: block; text-decoration: none; border-radius: 16px;
      padding: 15px 16px; font-size: 16px; font-weight: 700; margin-bottom: 10px;
    }
    a.primary { background: var(--accent); color: var(--on-accent); }
    a.ghost { border: 1px solid var(--line); color: var(--sub); font-weight: 500; font-size: 14px; }
    .foot { margin-top: 22px; color: var(--dim); font-size: 12px; letter-spacing: 2px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <img class="mark" src="/assets/favicon-180.png" alt="Pickup" />
    <div class="check" id="check">✓</div>
    <h1 id="t">You’re in.</h1>
    <p class="sub" id="s">Email confirmed — your account is live. Open Pickup, set your sport, and call game.</p>
    <a class="btn primary" id="openapp" href="pickup://">Open Pickup</a>
    <a class="btn ghost" id="store" href="https://apps.apple.com/app/id6769906203">Don’t have the app yet? Get it free →</a>
    <div class="foot">PICKUP · CALL GAME.</div>
  </div>

  <script>
    (function () {
      // Supabase's /auth/v1/verify redirects here. Success arrives clean (or
      // with a session hash); a dead link arrives with error params in the
      // hash or query — show honest copy instead of a false "you're in".
      var hash = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
      var query = new URLSearchParams(window.location.search);
      var err = hash.get('error_description') || query.get('error_description') ||
                hash.get('error_code') || query.get('error_code') || '';
      if (err) {
        document.getElementById('check').style.display = 'none';
        document.getElementById('t').textContent = 'This link has expired';
        document.getElementById('s').textContent =
          'Confirmation links are single-use and time-limited. Open the Pickup app and tap “Resend email” on the confirm screen to get a fresh one.';
        document.title = 'Link expired — Pickup';
      }

      var IS_ANDROID = /Android/.test(navigator.userAgent || '');
      document.getElementById('store').href = IS_ANDROID
        ? 'https://play.google.com/store/apps/details?id=co.callgame.pickup'
        : 'https://apps.apple.com/app/id6769906203';
    })();
  </script>
</body>
</html>
