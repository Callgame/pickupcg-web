<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Open Pickup</title>
  <meta name="description" content="Open Pickup and call game." />
  <meta name="robots" content="noindex" />
  <!-- No apple-itunes-app banner here: its "Open" starts the app without the sign-in code. -->

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/favicon-180.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #070706; --card: #14140f; --line: #23231d;
      --ink: #f0f0eb; --sub: #96a098; --dim: #6e7670;
      --accent: #3dba5e; --on-accent: #062611;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: 'DM Sans', -apple-system, sans-serif;
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      width: 100%; max-width: 420px; background: var(--card);
      border: 1px solid var(--line); border-radius: 24px; padding: 36px 28px;
      text-align: center;
    }
    .mark { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 20px; display: block; }
    .check {
      width: 44px; height: 44px; border-radius: 22px; margin: 0 auto 16px;
      background: rgba(61, 186, 94, 0.14); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700;
    }
    h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 10px; }
    p.sub { color: var(--sub); font-size: 15px; line-height: 1.55; margin-bottom: 28px; }
    a.btn {
      display: block; text-decoration: none; border-radius: 16px;
      padding: 15px 16px; font-size: 16px; font-weight: 700; margin-bottom: 10px;
    }
    a.primary { background: var(--accent); color: var(--on-accent); }
    a.ghost { border: 1px solid var(--line); color: var(--sub); font-weight: 500; font-size: 14px; }
    p.hint { color: var(--sub); font-size: 13px; line-height: 1.5; margin: 4px 0 14px; }
    [hidden] { display: none !important; }
    .foot { margin-top: 22px; color: var(--dim); font-size: 12px; letter-spacing: 2px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <img class="mark" src="/assets/favicon-180.png" alt="Pickup" />
    <div class="check" id="check" hidden>✓</div>
    <h1 id="t">Back to Pickup</h1>
    <p class="sub" id="s">Open Pickup to go on.</p>
    <a class="btn primary" id="openapp" href="pickup://">Open Pickup</a>
    <p class="hint" id="hint">Nothing happened? Open Pickup yourself and log in with your email and password.</p>
    <a class="btn ghost" id="store" href="https://apps.apple.com/app/id6769906203">Don’t have the app yet? Get it free →</a>
    <div class="foot">PICKUP · CALL GAME.</div>
  </div>

  <script>
    (function () {
      // Supabase's /auth/v1/verify redirects here.
      //  - A sign-up's link: ?code=…, which signs them in once, on the phone that
      //    signed up, within five minutes of "Create account". The button hands it
      //    to the app (pickup://auth/callback). The app copes without it too: it
      //    tries the password they chose, or asks them to log in.
      //  - A link sent again: the session is in the hash. It is not handed on (any
      //    app can claim pickup://), and it is taken out of the address bar.
      //  - A dead link: error params in the hash or the query.
      var $ = function (id) { return document.getElementById(id); };
      var ua = navigator.userAgent || '';
      var hash = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
      var query = new URLSearchParams(window.location.search);
      var say = function (title, text) { $('t').textContent = title; $('s').textContent = text; document.title = title + ' · Pickup'; };
      var err = hash.get('error_description') || query.get('error_description') ||
                hash.get('error_code') || query.get('error_code') ||
                hash.get('error') || query.get('error') || '';
      var code = query.get('code') || '';
      // An iPad says it is a Mac; a Mac has no touch screen.
      var PHONE = /iPhone|iPad|iPod|Android/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

      var goodCode = /^[A-Za-z0-9_-]{8,128}$/.test(code);
      var confirmed = goodCode || !!hash.get('access_token');

      if (hash.get('access_token')) history.replaceState(null, '', window.location.pathname);

      if (err) {
        say('This link no longer works', 'Each link works once, for a limited time. If you already confirmed your email, open Pickup and log in. If not, open Pickup and have the email sent again.');
        $('hint').hidden = true;
      } else if (confirmed) {
        $('check').hidden = false;
        say('Email confirmed', PHONE ? 'Open Pickup to finish signing in.'
          : 'Go back to Pickup on the phone you signed up with. If it doesn’t sign you in, log in with your email and password.');
      }
      if (goodCode && !err) $('openapp').href = 'pickup://auth/callback?code=' + encodeURIComponent(code);
      if (!PHONE) { $('openapp').hidden = true; $('hint').hidden = true; }

      $('store').href = /Android/.test(ua)
        ? 'https://play.google.com/store/apps/details?id=co.callgame.pickup'
        : 'https://apps.apple.com/app/id6769906203';
    })();
  </script>
</body>
</html>
